name: Verify Published Appcast

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to verify (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: verify-appcast-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-appcast:
    name: Verify release feed and Sparkle signature
    runs-on: macos-15
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate requested release tag
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_tag must use stable vX.Y.Z syntax' >&2
            exit 1
          }

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Resolve pinned Sparkle tools
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project 'Claude Usage.xcodeproj' \
            -scheme 'Claude Usage' \
            -derivedDataPath build

      - name: Download published release unit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'RevvyTach.dmg' \
            --pattern 'appcast.xml'

      - name: Verify release source provenance
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" FETCH_HEAD || {
            echo 'Release source is not contained in origin/main.' >&2
            exit 1
          }

      - name: Verify artifact cohesion and Sparkle signature
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n $SPARKLE_PRIVATE_KEY && -n $SPARKLE_PUBLIC_ED_KEY ]] || {
            echo 'Release Sparkle key configuration is missing.' >&2
            exit 1
          }
          # shellcheck source=scripts/release_constants.sh
          source scripts/release_constants.sh

          # release-metadata.json is no longer a published asset (see RELEASING.md);
          # reconstruct its cohesion fields here from sources independent of the
          # downloaded DMG: the checked-out tag's project settings, git, and the
          # workflow's own knowledge of the release URL.
          #
          # The `commit` field below records the source revision this verification
          # ran against. It is NOT an artifact-derived provenance claim:
          # verify_release_artifacts.sh only checks that it is a 40-hex string, and
          # nothing in a published DMG identifies the commit it was built from. See
          # "Provenance" in RELEASING.md for what is and is not established here.
          version=${RELEASE_TAG#v}
          build_settings=$(xcodebuild \
            -project 'Claude Usage.xcodeproj' \
            -target 'Claude Usage' \
            -configuration Release \
            -showBuildSettings)
          build=$(awk '/ CURRENT_PROJECT_VERSION = / { print $3; exit }' <<< "$build_settings")
          sha256=$(shasum -a 256 release/RevvyTach.dmg | awk '{ print $1 }')
          artifact_url="$release_repository_url/releases/download/$RELEASE_TAG/RevvyTach.dmg"

          # GitHub computes the per-asset digest asynchronously after upload, so
          # it can be empty immediately after the release is published. Poll
          # for up to 60s before giving up, then cross-check it against the
          # downloaded bytes as an independent verification of $sha256.
          expected_digest=''
          for _ in $(seq 1 12); do
            expected_digest=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[] | select(.name == "RevvyTach.dmg") | .digest')
            [[ -n $expected_digest ]] && break
            echo 'Waiting for GitHub to publish the release asset digest...' >&2
            sleep 5
          done
          [[ -n $expected_digest ]] || {
            echo 'GitHub never published a digest for RevvyTach.dmg after 60s.' >&2
            exit 1
          }
          [[ $expected_digest == "sha256:$sha256" ]] || {
            echo 'Downloaded DMG checksum does not match the GitHub-reported digest.' >&2
            exit 1
          }

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$version" \
            --arg build "$build" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg bundleIdentifier "$release_bundle_identifier" \
            --arg minimumSystemVersion '14.0' \
            --arg artifactURL "$artifact_url" \
            --arg sha256 "$sha256" \
            '{
              tag: $tag,
              version: $version,
              build: $build,
              commit: $commit,
              bundleIdentifier: $bundleIdentifier,
              minimumSystemVersion: $minimumSystemVersion,
              artifactURL: $artifactURL,
              sha256: $sha256
            }' > release/release-metadata.json

          ./scripts/verify_release_artifacts.sh \
            --require-developer-id \
            --require-notarization \
            release/RevvyTach.dmg \
            release/appcast.xml \
            release/release-metadata.json

          mount_point="$RUNNER_TEMP/release-app"
          mkdir -p "$mount_point"
          cleanup_mount() { hdiutil detach "$mount_point" -quiet -force 2>/dev/null || true; }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" release/RevvyTach.dmg >/dev/null
          embedded_key=$(defaults read \
            "$mount_point/RevvyTach.app/Contents/Info.plist" \
            SUPublicEDKey)
          [[ $embedded_key == "$SPARKLE_PUBLIC_ED_KEY" ]] || {
            echo 'Published app key does not match the protected Revenium variable.' >&2
            exit 1
          }

          signature=$(xmllint --xpath \
            'string(//*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            release/appcast.xml)
          sign_update='build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update'
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" \
            --verify \
            --ed-key-file - \
            release/RevvyTach.dmg \
            "$signature"

          echo 'Published appcast and release unit verified.'

      - name: Verification summary
        run: |
          {
            echo '## Published appcast verified'
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo '- Feed asset: `appcast.xml`'
            echo '- Archive signature, checksum, app identity, notarization, and artifact URL are cohesive'
            echo '- No GitHub Pages or inherited feed content was used'
          } >> "$GITHUB_STEP_SUMMARY"
