name: Verify Published Appcast

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to verify (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: verify-appcast-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-appcast:
    name: Verify release feed and Sparkle signature
    runs-on: macos-15
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate requested release tag
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_tag must use stable vX.Y.Z syntax' >&2
            exit 1
          }

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Resolve pinned Sparkle tools
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project 'Claude Usage.xcodeproj' \
            -scheme 'Claude Usage' \
            -derivedDataPath build

      - name: Download published release unit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'Claude-Usage.zip' \
            --pattern 'Claude-Usage.zip.sha256' \
            --pattern 'appcast.xml' \
            --pattern 'release-metadata.json'

      - name: Verify release source provenance
        run: |
          set -euo pipefail
          metadata_commit=$(plutil -extract commit raw -o - \
            release/release-metadata.json)
          source_commit=$(git rev-parse HEAD)
          [[ $metadata_commit == "$source_commit" ]] || {
            echo 'Release metadata does not name the checked-out tag commit.' >&2
            exit 1
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" FETCH_HEAD || {
            echo 'Release source is not contained in origin/main.' >&2
            exit 1
          }

      - name: Verify artifact cohesion and Sparkle signature
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          [[ -n $SPARKLE_PRIVATE_KEY && -n $SPARKLE_PUBLIC_ED_KEY ]] || {
            echo 'Release Sparkle key configuration is missing.' >&2
            exit 1
          }

          ./scripts/verify_release_artifacts.sh \
            --require-developer-id \
            --require-notarization \
            release/Claude-Usage.zip \
            release/appcast.xml \
            release/Claude-Usage.zip.sha256 \
            release/release-metadata.json

          embedded_key=$(ditto -x -k release/Claude-Usage.zip "$RUNNER_TEMP/release-app" \
            >/dev/null && defaults read \
            "$RUNNER_TEMP/release-app/Claude Usage.app/Contents/Info.plist" \
            SUPublicEDKey)
          [[ $embedded_key == "$SPARKLE_PUBLIC_ED_KEY" ]] || {
            echo 'Published app key does not match the protected Revenium variable.' >&2
            exit 1
          }

          signature=$(xmllint --xpath \
            'string(//*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            release/appcast.xml)
          sign_update='build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update'
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" \
            --verify \
            --ed-key-file - \
            release/Claude-Usage.zip \
            "$signature"

          echo 'Published appcast and release unit verified.'

      - name: Verification summary
        run: |
          {
            echo '## Published appcast verified'
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo '- Feed asset: `appcast.xml`'
            echo '- Archive signature, checksum, app identity, notarization, and artifact URL are cohesive'
            echo '- No GitHub Pages or inherited feed content was used'
          } >> "$GITHUB_STEP_SUMMARY"
