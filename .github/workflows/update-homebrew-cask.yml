name: Update Homebrew Cask

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Fine-grained token with Contents write on revenium/homebrew-tap
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish to Homebrew (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: homebrew-cask-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-cask:
    name: Verify release and update Revenium tap
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate requested release tag
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_tag must use stable vX.Y.Z syntax' >&2
            exit 1
          }

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          persist-credentials: false

      - name: Checkout Revenium Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: revenium/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download and verify released artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'Claude-Usage.zip' \
            --pattern 'Claude-Usage.zip.sha256' \
            --pattern 'release-metadata.json'

          expected_sha=$(awk 'NR == 1 { print $1 }' release/Claude-Usage.zip.sha256)
          actual_sha=$(shasum -a 256 release/Claude-Usage.zip | awk '{ print $1 }')
          metadata_sha=$(plutil -extract sha256 raw -o - release/release-metadata.json)
          metadata_tag=$(plutil -extract tag raw -o - release/release-metadata.json)
          metadata_url=$(plutil -extract artifactURL raw -o - release/release-metadata.json)
          expected_url="https://github.com/revenium/Claude-Usage-Tracker/releases/download/$RELEASE_TAG/Claude-Usage.zip"

          [[ $actual_sha == "$expected_sha" && $actual_sha == "$metadata_sha" ]] || {
            echo 'Release ZIP, checksum, and metadata SHA-256 values do not match.' >&2
            exit 1
          }
          [[ $metadata_tag == "$RELEASE_TAG" && $metadata_url == "$expected_url" ]] || {
            echo 'Release metadata tag or URL is not cohesive.' >&2
            exit 1
          }

          echo "RELEASE_SHA256=$actual_sha" >> "$GITHUB_ENV"

      - name: Render first-party cask
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          ./source/scripts/render_homebrew_cask.sh \
            "$version" \
            "$RELEASE_SHA256" \
            "$GITHUB_WORKSPACE/homebrew-tap/Casks/claude-usage.rb"
          git -C homebrew-tap diff --check

      - name: Audit cask and resolve release artifact
        run: |
          set -euo pipefail
          brew tap revenium/tap
          audit_tap=$(brew --repository revenium/tap)
          mkdir -p "$audit_tap/Casks"
          cp homebrew-tap/Casks/claude-usage.rb "$audit_tap/Casks/claude-usage.rb"

          brew audit --cask --strict revenium/tap/claude-usage
          brew fetch --cask --force revenium/tap/claude-usage
          brew install --cask --dry-run --require-sha revenium/tap/claude-usage

      - name: Commit and push cask
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/claude-usage.rb

          if git diff --cached --quiet; then
            echo 'Cask already matches this release.'
            exit 0
          fi

          git diff --cached --check
          git commit -m "Update claude-usage to $RELEASE_TAG"
          git push origin HEAD:main

      - name: Homebrew summary
        run: |
          {
            echo '## Revenium Homebrew cask updated'
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo '- Cask: `revenium/tap/claude-usage`'
            echo '- SHA-256: `'"$RELEASE_SHA256"'`'
            echo '- `brew audit`, `brew fetch`, and dry-run install passed'
          } >> "$GITHUB_STEP_SUMMARY"
