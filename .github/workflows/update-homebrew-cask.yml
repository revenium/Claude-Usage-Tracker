name: Update Homebrew Cask

on:
  workflow_call:
    inputs:
      release_tag:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Fine-grained token with Contents write on revenium/homebrew-tap
        required: true

concurrency:
  group: homebrew-cask-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-cask:
    name: Verify release and update Revenium tap
    runs-on: macos-15
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate requested release tag
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'release_tag must use stable vX.Y.Z syntax' >&2
            exit 1
          }

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Download and verify released artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --pattern 'RevvyTach.dmg'

          # release-metadata.json is generated during release but not published
          # (see RELEASING.md); GitHub's own per-asset digest is the integrity
          # check for the downloaded DMG instead of an unsigned sidecar file.
          actual_sha=$(shasum -a 256 release/RevvyTach.dmg | awk '{ print $1 }')

          # GitHub computes the per-asset digest asynchronously after upload, so
          # it can be empty immediately after the release is published. Poll
          # for up to 60s before giving up.
          expected_digest=''
          for _ in $(seq 1 12); do
            expected_digest=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[] | select(.name == "RevvyTach.dmg") | .digest')
            [[ -n $expected_digest ]] && break
            echo 'Waiting for GitHub to publish the release asset digest...' >&2
            sleep 5
          done
          [[ -n $expected_digest ]] || {
            echo 'GitHub never published a digest for RevvyTach.dmg after 60s.' >&2
            exit 1
          }
          [[ $expected_digest == "sha256:$actual_sha" ]] || {
            echo 'Release DMG checksum does not match the GitHub-reported digest.' >&2
            exit 1
          }

          source_commit=$(git -C source rev-parse HEAD)
          git -C source fetch --no-tags origin main
          git -C source merge-base --is-ancestor "$source_commit" FETCH_HEAD || {
            echo 'Release source is not contained in origin/main.' >&2
            exit 1
          }

          echo "RELEASE_SHA256=$actual_sha" >> "$GITHUB_ENV"

      - name: Render first-party cask
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          ./source/scripts/render_homebrew_cask.sh \
            "$version" \
            "$RELEASE_SHA256" \
            "$RUNNER_TEMP/revvytach.rb"

      - name: Audit cask and resolve release artifact
        run: |
          set -euo pipefail
          brew tap revenium/tap
          audit_tap=$(brew --repository revenium/tap)
          mkdir -p "$audit_tap/Casks"
          cp "$RUNNER_TEMP/revvytach.rb" "$audit_tap/Casks/revvytach.rb"

          brew audit --cask --strict revenium/tap/revvytach
          brew fetch --cask --force revenium/tap/revvytach
          brew install --cask --dry-run --require-sha revenium/tap/revvytach

      - name: Publish cask with an optimistic SHA guard
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          endpoint='repos/revenium/homebrew-tap/contents/Casks/revvytach.rb'
          current=$(gh api "$endpoint?ref=main" 2>/dev/null || true)
          current_sha=$(jq -r '.sha // empty' <<< "$current")
          current_content=$(jq -r '.content // empty' <<< "$current" | tr -d '\n')
          desired_content=$(base64 < "$RUNNER_TEMP/revvytach.rb" | tr -d '\n')

          if [[ -n $current_content && $current_content == "$desired_content" ]]; then
            echo 'Cask already matches this release.'
            exit 0
          fi

          request=(
            --method PUT
            "$endpoint"
            -f "message=Update revvytach to $RELEASE_TAG"
            -f "content=$desired_content"
            -f 'branch=main'
          )
          if [[ -n $current_sha ]]; then
            request+=(-f "sha=$current_sha")
          fi
          gh api "${request[@]}" --silent

      - name: Homebrew summary
        run: |
          {
            echo '## Revenium Homebrew cask updated'
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo '- Cask: `revenium/tap/revvytach`'
            echo '- SHA-256: `'"$RELEASE_SHA256"'`'
            echo '- `brew audit`, `brew fetch`, and dry-run install passed'
          } >> "$GITHUB_STEP_SUMMARY"
