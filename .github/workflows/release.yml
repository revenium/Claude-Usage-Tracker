name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PRODUCT_NAME: Claude Usage
  PRODUCT_BUNDLE_ID: HamedElfayome.Claude-Usage
  RELEASE_ASSET: Claude-Usage.dmg
  SPARKLE_FEED_URL: https://github.com/revenium/Claude-Usage-Tracker/releases/latest/download/appcast.xml

jobs:
  release:
    name: Test, sign, notarize, verify, and publish
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    outputs:
      release_tag: ${{ steps.release_identity.outputs.tag }}

    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          sw_vers
          echo "Release tag: $GITHUB_REF_NAME"
          echo "Release commit: $GITHUB_SHA"

      - name: Validate release identity and configuration
        id: release_identity
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use stable vX.Y.Z syntax." >&2
            exit 1
          }

          version=${GITHUB_REF_NAME#v}
          build_settings=$(xcodebuild \
            -project 'Claude Usage.xcodeproj' \
            -target 'Claude Usage' \
            -configuration Release \
            -showBuildSettings)
          marketing_version=$(awk '/ MARKETING_VERSION = / { print $3; exit }' <<< "$build_settings")
          build_version=$(awk '/ CURRENT_PROJECT_VERSION = / { print $3; exit }' <<< "$build_settings")

          if [[ $marketing_version != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION ($marketing_version)." >&2
            exit 1
          fi

          if [[ ! $build_version =~ ^[0-9]+$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be an integer ($build_version)." >&2
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          [[ $tag_commit == "$GITHUB_SHA" ]] || {
            echo "Tag commit does not match the workflow commit." >&2
            exit 1
          }

          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit must already be contained in origin/main." >&2
            exit 1
          }

          for required_name in \
            SPARKLE_PUBLIC_ED_KEY \
            SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            SPARKLE_PRIVATE_KEY; do
            if [[ -z ${!required_name:-} ]]; then
              echo "Required release setting is missing: $required_name" >&2
              exit 1
            fi
          done

          [[ $SIGNING_IDENTITY == 'Developer ID Application: '* ]] || {
            echo "DEVELOPER_ID_APPLICATION must name a Developer ID Application identity." >&2
            exit 1
          }
          [[ $APPLE_TEAM_ID =~ ^[A-Z0-9]{10}$ ]] || {
            echo "APPLE_TEAM_ID must be a 10-character Apple team identifier." >&2
            exit 1
          }

          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PUBLIC_ED_KEY" | openssl base64 -d -A > "$key_file"
          [[ $(stat -f%z "$key_file") -eq 32 ]] || {
            echo "SPARKLE_PUBLIC_ED_KEY is not a 32-byte Ed25519 public key." >&2
            exit 1
          }

          ./scripts/validate_distribution.sh
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build_version" >> "$GITHUB_OUTPUT"

      - name: Validate localization catalogs
        run: ./scripts/validate_localizations.sh

      - name: Test UsageKit packages
        run: swift test --package-path Packages/UsageKit

      - name: Test application
        run: |
          set -euo pipefail
          xcodebuild test \
            -project 'Claude Usage.xcodeproj' \
            -scheme 'Claude Usage' \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/claude-usage-signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "\"$SIGNING_IDENTITY\"" >/dev/null || {
              echo "Configured Developer ID identity is not present in the imported certificate." >&2
              exit 1
            }

          rm -f "$certificate_path"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build universal Release app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project 'Claude Usage.xcodeproj' \
            -scheme 'Claude Usage' \
            -configuration Release \
            -derivedDataPath build \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            REVENIUM_UPDATE_CHANNEL=production \
            SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY"

      - name: Sign app and Sparkle components
        env:
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          app_path="build/Build/Products/Release/$PRODUCT_NAME.app"
          sparkle="$app_path/Contents/Frameworks/Sparkle.framework"

          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime \
            "$sparkle/Versions/B/XPCServices/Installer.xpc"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime --preserve-metadata=entitlements \
            "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime \
            "$sparkle/Versions/B/Autoupdate"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime \
            "$sparkle/Versions/B/Updater.app"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime \
            "$sparkle"
          codesign --force --sign "$SIGNING_IDENTITY" \
            --timestamp --options runtime \
            --entitlements 'Claude Usage/Claude UsageRelease.entitlements' \
            "$app_path"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dvvv "$app_path"
          codesign -d --entitlements :- "$app_path"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="build/Build/Products/Release/$PRODUCT_NAME.app"
          notarization_zip="$RUNNER_TEMP/claude-usage-notarization.zip"

          ditto -c -k --keepParent "$app_path" "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          rm -f "$notarization_zip"

      - name: Create and sign disk image
        env:
          SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          mkdir -p release
          app_path="build/Build/Products/Release/$PRODUCT_NAME.app"
          version=${GITHUB_REF_NAME#v}

          stage_dir=$(mktemp -d "$RUNNER_TEMP/claude-usage-dmg-stage.XXXXXX")
          cp -R "$app_path" "$stage_dir/"
          ln -s /Applications "$stage_dir/Applications"

          hdiutil create \
            -volname "$PRODUCT_NAME $version" \
            -srcfolder "$stage_dir" \
            -ov \
            -fs APFS \
            -format ULFO \
            "release/$RELEASE_ASSET"

          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "release/$RELEASE_ASSET"
          codesign --verify --verbose=2 "release/$RELEASE_ASSET"

          rm -rf "$stage_dir"

      - name: Notarize and staple disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "release/$RELEASE_ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "release/$RELEASE_ASSET"
          xcrun stapler validate "release/$RELEASE_ASSET"
          spctl --assess --type open --context context:primary-signature --verbose=4 "release/$RELEASE_ASSET"

      - name: Package release notes
        run: |
          set -euo pipefail
          mkdir -p appcast-input

          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1 }
            found && /^## \[/ && index($0, "## [" version "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'Release %s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi

          cp "release/$RELEASE_ASSET" "appcast-input/$RELEASE_ASSET"
          {
            printf '<!doctype html><html><body><pre>\n'
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              release-notes.md
            printf '</pre></body></html>\n'
          } > appcast-input/Claude-Usage.html

      - name: Generate and verify Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sparkle_bin='build/SourcePackages/artifacts/sparkle/Sparkle/bin'
          generate_appcast="$sparkle_bin/generate_appcast"
          sign_update="$sparkle_bin/sign_update"
          [[ -x $generate_appcast && -x $sign_update ]]

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/revenium/Claude-Usage-Tracker/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/revenium/Claude-Usage-Tracker/releases/tag/$GITHUB_REF_NAME" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --maximum-versions 1 \
            -o release/appcast.xml \
            appcast-input

          signature=$(xmllint --xpath \
            'string(//*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            release/appcast.xml)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" \
            --verify \
            --ed-key-file - \
            "release/$RELEASE_ASSET" \
            "$signature"

      - name: Create release metadata and verify final artifacts
        id: artifact
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          build=$(defaults read \
            "$PWD/build/Build/Products/Release/$PRODUCT_NAME.app/Contents/Info.plist" \
            CFBundleVersion)
          sha256=$(shasum -a 256 "release/$RELEASE_ASSET" | awk '{ print $1 }')
          artifact_url="https://github.com/revenium/Claude-Usage-Tracker/releases/download/$GITHUB_REF_NAME/$RELEASE_ASSET"

          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "$version" \
            --arg build "$build" \
            --arg commit "$GITHUB_SHA" \
            --arg bundleIdentifier "$PRODUCT_BUNDLE_ID" \
            --arg minimumSystemVersion '14.0' \
            --arg artifactURL "$artifact_url" \
            --arg sha256 "$sha256" \
            '{
              tag: $tag,
              version: $version,
              build: $build,
              commit: $commit,
              bundleIdentifier: $bundleIdentifier,
              minimumSystemVersion: $minimumSystemVersion,
              artifactURL: $artifactURL,
              sha256: $sha256
            }' > release/release-metadata.json

          ./scripts/verify_release_artifacts.sh \
            --require-developer-id \
            --require-notarization \
            "release/$RELEASE_ASSET" \
            release/appcast.xml \
            release/release-metadata.json

          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create or recover an owned draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="<!-- revenium-release-workflow:$GITHUB_SHA -->"
          {
            cat release-notes.md
            echo
            echo "$marker"
          } > release-notes-with-provenance.md

          existing=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,body 2>/dev/null || true)
          if [[ -n $existing ]]; then
            existing_draft=$(jq -r '.isDraft' <<< "$existing")
            existing_tag=$(jq -r '.tagName' <<< "$existing")
            existing_body=$(jq -r '.body' <<< "$existing")
            if [[ $existing_draft != true ||
                  $existing_tag != "$GITHUB_REF_NAME" ||
                  $existing_body != *"$marker"* ]]; then
              echo "Refusing to replace an unowned or published release: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes-with-provenance.md

      - name: Upload and remotely verify the complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "release/$RELEASE_ASSET#Universal notarized disk image" \
            'release/appcast.xml#Sparkle update feed' \
            --repo "$GITHUB_REPOSITORY"

          asset_names=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets \
            --jq 'select(.isDraft == true) | [.assets[].name] | sort | join("\n")')
          expected_names=$'Claude-Usage.dmg\nappcast.xml'
          [[ $asset_names == "$expected_names" ]] || {
            echo 'Draft release does not contain the exact cohesive asset set.' >&2
            exit 1
          }

          remote_dir="$RUNNER_TEMP/verified-draft"
          mkdir -p "$remote_dir"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_dir"
          for asset_name in \
            "$RELEASE_ASSET" \
            appcast.xml; do
            cmp -s \
              "release/$asset_name" \
              "$remote_dir/$asset_name" || {
                echo "Remote draft asset differs from the verified local artifact: $asset_name" >&2
                exit 1
              }
          done
          ./scripts/verify_release_artifacts.sh \
            --require-developer-id \
            --require-notarization \
            "$remote_dir/$RELEASE_ASSET" \
            "$remote_dir/appcast.xml" \
            release/release-metadata.json

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Clean signing material
        if: ${{ always() }}
        run: |
          if [[ -n ${SIGNING_KEYCHAIN:-} && -f $SIGNING_KEYCHAIN ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Release summary
        run: |
          {
            echo "## Release $GITHUB_REF_NAME"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Bundle ID: \`$PRODUCT_BUNDLE_ID\`"
            echo "- Artifact: \`$RELEASE_ASSET\`"
            echo "- Feed: $SPARKLE_FEED_URL"
            echo "- Signed, notarized, stapled, Gatekeeper-assessed, appcast-signed, and checksum-verified"
          } >> "$GITHUB_STEP_SUMMARY"

  update-homebrew:
    name: Update Revenium Homebrew tap
    needs: release
    uses: ./.github/workflows/update-homebrew-cask.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
